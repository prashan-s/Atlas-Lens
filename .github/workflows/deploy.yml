name: Deploy React App to GitHub Pages

on:
  push:
    branches:
      - main  # or master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Create Envionment File
        run: |
          echo "VITE_ATLAS_LENS_FIREBASE_API_KEY=${{ secrets.VITE_ATLAS_LENS_FIREBASE_API_KEY }}" > .env
          echo "VITE_ATLAS_LENS_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_ATLAS_LENS_FIREBASE_AUTH_DOMAIN }}" >> .env
          echo "VITE_ATLAS_LENS_FIREBASE_PROJECT_ID=${{ secrets.VITE_ATLAS_LENS_FIREBASE_PROJECT_ID }}" >> .env
          echo "VITE_ATLAS_LENS_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_ATLAS_LENS_FIREBASE_STORAGE_BUCKET }}" >> .env
          echo "VITE_ATLAS_LENS_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_ATLAS_LENS_FIREBASE_MESSAGING_SENDER_ID }}" >> .env
          echo "VITE_ATLAS_LENS_FIREBASE_APP_ID=${{ secrets.VITE_ATLAS_LENS_FIREBASE_APP_ID }}" >> .env
          
      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GH_TOKEN }}
          publish_dir: ./dist 